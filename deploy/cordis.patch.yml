# Deployment-side configuration template for dsh-plugin-framework.
#
# Copy the relevant snippet into the USER layer of a profile that mounts the
# plugin ($DSH_HOME/cordis.patch.yml or <profile>/cordis.patch.yml). The bundle
# patch layer (repo root cordis.patch.yml) is deliberately config-free: the
# deploy-time override belongs here, where it can differ per environment.
#
# Example - change the default greeting:

- set:
    - id: dsh-plugin-framework
      config:
        defaultGreeting: "Hello from production"
